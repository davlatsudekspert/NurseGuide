# Bir martalik: NurseGuide uchun YANGI Android upload keystore yaratadi.
# Natija: Actions run sahifasidagi "android-upload-keystore" artifact (1 kun saqlanadi) —
# ichida ANDROID_* secret qiymatlari. Ularni GitHub secretlarga o'zingiz qo'ying, so'ng artifactni o'chiring.
# Jurnalda faqat OMMAVIY barmoq izlari (SHA-1/SHA-256) chiqadi: Google OAuth Android client va Play uchun kerak.
name: android_keystore_init
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Keystore yaratish
        run: |
          set -euo pipefail
          mkdir -p out
          STORE_PASS="$(openssl rand -hex 16)"
          KEY_PASS="$(openssl rand -hex 16)"
          ALIAS="nurseguide-upload"
          echo "::add-mask::$STORE_PASS"
          echo "::add-mask::$KEY_PASS"
          keytool -genkeypair -v -keystore out/upload.jks -storetype JKS -alias "$ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
            -dname "CN=NurseGuide, OU=Mobile, O=NurseGuide, L=Tashkent, C=UZ" >/dev/null 2>&1
          base64 -w0 out/upload.jks > out/ANDROID_KEYSTORE_BASE64.txt
          printf '%s' "$STORE_PASS" > out/ANDROID_KEYSTORE_PASSWORD.txt
          printf '%s' "$ALIAS"      > out/ANDROID_KEY_ALIAS.txt
          printf '%s' "$KEY_PASS"   > out/ANDROID_KEY_PASSWORD.txt
          echo "### Upload sertifikati barmoq izlari (ommaviy)" >> "$GITHUB_STEP_SUMMARY"
          keytool -list -v -keystore out/upload.jks -alias "$ALIAS" -storepass "$STORE_PASS" 2>/dev/null \
            | grep -E "SHA1:|SHA256:" | sed 's/^ *//' | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: android-upload-keystore
          path: out/
          retention-days: 1
          if-no-files-found: error
